<!doctype html><html><head><meta charset="utf-8"><base href="/vendor/fluid/"><style>html,body{margin:0;height:100%;overflow:hidden;background:black}canvas{width:100%;height:100%;display:block}.promo,.dg{display:none!important}</style></head><body>
<canvas></canvas><div class="promo"><button class="promo-close"></button><a id="apple_link"></a><a id="google_link"></a></div>
<script>window.ga=()=>{};</script><script src="dat.gui.min.js"></script><script src="script.js"></script>
<script>
config.PAUSED=true;config.DYE_RESOLUTION=512;initFramebuffers();let last=0,session=null;
function inject(left){
 const hue=Math.random()*6,brightness=1.2+Math.random()*.8;
 const component=offset=>{const k=(offset+hue)%6;return brightness*(1-.85*Math.max(0,Math.min(k,4-k,1)));};
 const color={r:component(5),g:component(3),b:component(1)};
 const x=(left?.20:.70)+Math.random()*.10,y=.25+Math.random()*.50;
 const force=450+Math.random()*950,dy=(Math.random()-.5)*900;
 const radius=config.SPLAT_RADIUS;
 try{config.SPLAT_RADIUS=.12+Math.random()*.53;splat(x,y,left?force:-force,dy,color);}
 finally{config.SPLAT_RADIUS=radius;}
}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data.type!=='z20-fluid')return;
const s=e.data.state;config.PAUSED=s.menu||s.mode!=='fluid'||s.stopped;
if(session!==s.session){session=s.session;last=0;}
if(!config.PAUSED)for(const action of s.actions||[]){if(action.id<=last||action.epoch!==s.epoch)continue;last=action.id;if(['inject_left','inject_right'].includes(action.name))inject(action.name==='inject_left');}
});
</script></body></html>
